views:
  - title: "Cocktail"
    path: cocktail
    icon: mdi:glass-cocktail
    type: sections
    sections:
      - type: grid
        cards:
          # Page 1: idle - Select recipe + Start
          - type: conditional
            conditions:
              - condition: state
                entity: select.thirdreality_smart_scale_cocktail_step
                state: "idle"
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  content: |
                    # 🍸 Cocktail Station
                    ### Choose your cocktail and press Start!
                    ---
                - type: tile
                  entity: select.thirdreality_smart_scale_select_cocktail
                  name: "Choose Your Cocktail"
                  icon: mdi:book-open-variant
                  color: amber
                - type: conditional
                  conditions:
                    - condition: state
                      entity: select.thirdreality_smart_scale_select_cocktail
                      state: "custom"
                  card:
                    type: vertical-stack
                    cards:
                      - type: markdown
                        content: >
                          {% set val = states('text.thirdreality_smart_scale_custom_recipe') %}
                          {% if val in ['unknown', 'unavailable', ''] %}
                          ✏️ **Enter your custom recipe below**

                          Format: ingredient1:weight1,ingredient2:weight2,...

                          Example: vodka:50,orange juice:100,ice:20
                          {% else %}
                          ✏️ **Custom recipe:** {{ val }}
                          {% endif %}
                      - type: entities
                        entities:
                          - entity: text.thirdreality_smart_scale_custom_recipe
                            name: "✏️ Enter ingredients here"
                - type: button
                  name: "▶️ Start Mixing"
                  icon: mdi:play-circle
                  icon_height: 40px
                  show_state: false
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.thirdreality_smart_scale_start_cocktail

          # Page 2: mixing - Current step + ingredients + scale + Done
          - type: conditional
            conditions:
              - condition: state
                entity: select.thirdreality_smart_scale_cocktail_step
                state: "mixing"
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  content: >
                    {% set status = states('text.thirdreality_smart_scale_cocktail_status') %}
                    {% if '|' in status %}
                    {% set p = status.split('|') %}

                    ## {{ p[0] | trim }}

                    ### {{ p[1] | trim }}

                    ---

                    # {{ p[2] | trim }}

                    # {{ p[3] | trim }}

                    {% else %}

                    ## {{ status }}

                    {% endif %}

                - type: markdown
                  content: >
                    {% set list = states('text.thirdreality_smart_scale_cocktail_recipe_list') %}
                    {% if list not in ['unknown', 'unavailable', ''] %}

                    **📜 Ingredients:**
                    {% for item in list.split('|') %}
                    {{ item | trim }}
                    {% endfor %}

                    {% endif %}

                - type: tile
                  entity: sensor.thirdreality_smart_scale_weight
                  name: "⚖️ Current Weight"
                  icon: mdi:scale
                  color: cyan

                - type: button
                  name: "Done ✅ — Next Step"
                  icon: mdi:check-circle
                  icon_height: 40px
                  show_state: false
                  tap_action:
                    action: call-service
                    service: button.press
                    target:
                      entity_id: button.thirdreality_smart_scale_done

                - type: button
                  name: "🏠 Back to Home"
                  icon: mdi:home
                  icon_height: 28px
                  show_state: false
                  tap_action:
                    action: call-service
                    service: select.select_option
                    data:
                      option: "idle"
                    target:
                      entity_id: select.thirdreality_smart_scale_cocktail_step

          # Page 3: complete - Celebration + back button
          - type: conditional
            conditions:
              - condition: state
                entity: select.thirdreality_smart_scale_cocktail_step
                state: "complete"
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  content: |
                    # 🎉 Cheers!
                    ### Your cocktail is ready! Enjoy! 🥂
                    ---

                - type: button
                  name: "🔄 Make Another Cocktail"
                  icon: mdi:arrow-left-circle
                  icon_height: 28px
                  show_state: false
                  tap_action:
                    action: call-service
                    service: select.select_option
                    data:
                      option: "idle"
                    target:
                      entity_id: select.thirdreality_smart_scale_cocktail_step

views:
  - title: "Calories"
    path: calories
    icon: mdi:fire
    type: sections
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              # 🔥 Calorie Tracker
              ### Smart food calorie counter with voice guidance

          - type: markdown
            content: >  
              {%- set today = states('number.thirdreality_smart_scale_today_calories') | float(0) -%}
              {%- set target = states('number.thirdreality_smart_scale_daily_calorie_target') | float(2000) -%}
              {%- set remaining = (target - today) | round(0) -%}
              {%- set pct = ((today / target) * 100) | round(0) -%}

              ## 📊 Today: {{ today | round(0) }} / {{ target | round(0) }} kcal

              {% if pct <= 100 %}
              🟩 {{ '█' * (pct // 5) }}{{ '░' * (20 - pct // 5) }} {{ pct }}%
              {% else %}
              🟥 {{ '█' * 20 }} {{ pct }}% ⚠️ OVER
              {% endif %}

              {% if remaining > 0 %}
              **{{ remaining }} kcal remaining**
              {% if remaining > 800 %} 🟢 On track!{% elif remaining > 400 %} 🟡 Moderate{% else %} 🟠 Almost there{% endif %}
              {% else %}
              **⚠️ Exceeded by {{ remaining | abs }} kcal**
              {% endif %}

          - type: entities
            title: "⚙️ Settings"
            entities:
              - entity: number.thirdreality_smart_scale_daily_calorie_target
                name: "🎯 Daily Target"
              - entity: number.thirdreality_smart_scale_meal_calorie_warning
                name: "⚠️ Meal Warning"

          - type: tile
            entity: select.thirdreality_smart_scale_food_preset
            name: "Select Food"
            icon: mdi:food-apple
            color: green

          - type: entities
            entities:
              - entity: text.thirdreality_smart_scale_custom_food_name
                name: "✏️ Custom Food Name"
              - entity: number.thirdreality_smart_scale_custom_cal_per_100g
                name: "🔥 Calories per 100g"

          - type: markdown
            content: >
              {%- set weight = states('sensor.thirdreality_smart_scale_weight') | float(0) -%}
              {%- set custom_name = states('text.thirdreality_smart_scale_custom_food_name') | trim -%}
              {%- set custom_cal = states('number.thirdreality_smart_scale_custom_cal_per_100g') | float(0) -%}
              {%- set food_db = "Apple:52,Banana:89,Orange:47,Strawberry:32,Blueberry:57,Grapes:69,Watermelon:30,Avocado:160,Chicken Breast:165,Ground Beef:250,Salmon:208,Shrimp:85,Tuna:130,Bacon:541,Turkey:135,Egg:155,Rice (cooked):130,Pasta (cooked):131,Bread (white):265,Bread (wheat):247,Oatmeal:68,Cereal:379,Potato:77,Sweet Potato:86,Corn:96,Broccoli:34,Carrot:41,Spinach:23,Tomato:18,Lettuce:15,Onion:40,Cheese (cheddar):403,Milk (whole):61,Milk (skim):34,Yogurt (plain):59,Butter:717,Peanut Butter:588,Almonds:579,Walnuts:654,Olive Oil:884,Honey:304,Sugar:387,Chocolate:546,Ice Cream:207,Pizza:266,Hamburger:295,French Fries:312,Hot Dog:290,Steak:271,Tofu:76" -%}
              {%- set selected = states('select.thirdreality_smart_scale_food_preset') -%}
              {% if custom_name | length > 0 and custom_cal > 0 %}
              {%- set cal_100 = custom_cal -%}
              {%- set fname = custom_name -%}
              {% else %}
              {%- set ns = namespace(val=0) -%}
              {%- for item in food_db.split(',') -%}{%- set parts = item.split(':') -%}{%- if parts[0] | trim == selected -%}{%- set ns.val = parts[1] | trim | float(0) -%}{%- endif -%}{%- endfor -%}
              {%- set cal_100 = ns.val -%}
              {%- set fname = selected -%}
              {% endif %}

              ### ⚖️ {{ weight | round(0) }}g — {{ fname }}

              {% if weight > 0 and cal_100 > 0 %}
              # 🔥 {{ (weight * cal_100 / 100) | round(0) }} kcal
              {% if cal_100 >= 400 %}
              ⚠️ High calorie: {{ cal_100 | round(0) }} cal/100g
              {% endif %}
              {% else %}
              Place food on scale to see calories
              {% endif %}

          - type: horizontal-stack
            cards:
              - type: button
                name: "Add ➕"
                icon: mdi:plus-circle
                icon_height: 36px
                show_state: false
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.thirdreality_smart_scale_add_food

              - type: button
                name: "Finish Meal ✅"
                icon: mdi:check-circle
                icon_height: 36px
                show_state: false
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.thirdreality_smart_scale_finish_meal

              - type: button
                name: "Reset 🗑️"
                icon: mdi:delete
                icon_height: 36px
                show_state: false
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.thirdreality_smart_scale_reset_today

          - type: markdown
            content: >
              {% if states('text.thirdreality_smart_scale_calorie_status') in ['unknown', 'unavailable', ''] %}
              ### 🔥 Ready! Select a food and place it on the scale.
              {% else %}
              ### {{ states('text.thirdreality_smart_scale_calorie_status') }}
              {% endif %}

          - type: conditional
            conditions:
              - condition: state
                entity: text.thirdreality_smart_scale_meal_log
                state_not: "Empty"
              - condition: state
                entity: text.thirdreality_smart_scale_meal_log
                state_not: ""
              - condition: state
                entity: text.thirdreality_smart_scale_meal_log
                state_not: "unknown"
              - condition: state
                entity: text.thirdreality_smart_scale_meal_log
                state_not: "unavailable"
            card:
              type: markdown
              content: >
                **🍽️ Current Meal** ({{ states('number.thirdreality_smart_scale_meal_calories') | round(0) }} kcal):

                {% for item in states('text.thirdreality_smart_scale_meal_log').split(' | ') %}
                • {{ item }}
                {% endfor %}
